services:
  db:
    image: postgres:16
    container_name: story_engine_local_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: story_engine
      POSTGRES_USER: story_engine
      POSTGRES_PASSWORD: story_engine_dev
    ports:
      - "5432:5432"
    volumes:
      - story_engine_local_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U story_engine -d story_engine"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  story_engine_local_db_data:
