[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "brahma"
version = "0.1.0"
description = "Brahma Databricks application and generation workers"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "sqlalchemy>=2.0,<3.0",
  # [binary] bundles a prebuilt libpq so the Databricks App container (which
  # has no system libpq) doesn't crash at import time with "no pq wrapper
  # available" — confirmed live: the App crashed at startup with exactly
  # that ImportError when this was bare "psycopg" (requirements.txt already
  # had [binary], but the App builds from this file's wheel metadata, not
  # requirements.txt, so the two had drifted out of sync).
  "psycopg[binary]>=3.2,<4.0",
  "psycopg-pool>=3.2,<4.0",
  "databricks-sdk>=0.89,<1.0",
  "sse-starlette>=2.1,<3.0",
  # Required by FastAPI's `UploadFile`/`Form(...)` handling — the per-character
  # voice upload route (`api/routes/character_voice.py`) accepts multipart
  # form data.
  "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
  "build>=1.2,<2.0",
  # Local-only convenience: `api/settings.py` loads `.env` (gitignored) when
  # present so `OPENAI_API_KEY`/`LOCAL_DATABASE_URL`/etc. don't need to be
  # re-exported in every new terminal. Never required in the deployed App
  # (Databricks injects these as real env vars; no .env file exists there).
  "python-dotenv>=1.0,<2.0",
]

[project.entry-points.packages]
run_generation_job = "story_engine.workers.generation_job:main"
run_report_job = "story_engine.workers.report_job:main"
run_memory_compaction_job = "story_engine.workers.memory_compaction:main"
run_audit_export_job = "story_engine.analytics.export_generation_audit:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks receive `dbutils` as an injected runtime global.
"notebooks/*.py" = ["F821"]
# Integration/unit test fixtures favor one readable inline SQL/assertion
# string over an arbitrarily wrapped one; long lines here aren't a code smell.
"tests/integration/persistence/*.py" = ["E501"]
"tests/integration/workers/*.py" = ["E501"]
"tests/security/*.py" = ["E501"]
"tests/unit/agents/test_canon_events.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["story_engine"]

[[tool.mypy.overrides]]
# PySpark is a Databricks-runtime-provided dependency, not installed for
# local/CI unit testing; export_generation_audit.py only imports it under
# TYPE_CHECKING so this override only affects type-checking, not runtime.
module = "pyspark.*"
ignore_missing_imports = true
