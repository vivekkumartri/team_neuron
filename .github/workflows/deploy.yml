name: Deploy Databricks bundle

on:
  workflow_dispatch:
    inputs:
      target:
        description: Bundle target to deploy
        required: true
        type: choice
        options: [dev, staging, prod]

jobs:
  # Task 5J.3 release gate: every check the release checklist requires before
  # a deploy is allowed to proceed, re-run here rather than trusted from a
  # prior CI run (a workflow_dispatch deploy can be triggered independently
  # of the PR that last ran CI).
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Full test suite (unit, contract, security)
        run: pytest -q
      - run: ruff check .
      - run: mypy src/story_engine
      - run: python scripts/check_task_paths.py
      - name: RLS negative test against the target's database
        if: ${{ inputs.target != 'dev' }}
        env:
          TEST_DATABASE_URL: ${{ secrets.STAGING_TEST_DATABASE_URL }}
        run: pytest tests/security/test_rls_negative.py tests/security/test_personalization_isolation.py -q

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e '.[dev]'
      - run: npm ci && npm run build
      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
          echo "$HOME/.databricks/bin" >> "$GITHUB_PATH"
      - name: Validate bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: databricks bundle validate -t "${{ inputs.target }}"
      - name: Deploy bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          databricks bundle deploy -t "${{ inputs.target }}"
          echo "Deployed bundle target ${{ inputs.target }} at commit ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
      - name: Post-deploy health check
        run: |
          # Placeholder: replace <app-url> with the deployed App's actual URL.
          # Never verified — no Databricks workspace exists in this project's
          # development sandbox yet. See docs/runbooks/release-checklist.md.
          echo "TODO: curl -f https://<app-url>/api/v1/readiness"

  worker-smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Trigger a worker job run and confirm it completes
        run: |
          # Placeholder: `databricks jobs run-now --job-id <id>` against the
          # deployed generation_job resource, then poll for a terminal
          # status. Unverified. See docs/runbooks/release-checklist.md.
          echo "TODO: databricks jobs run-now --job-id <generation_job id>"

