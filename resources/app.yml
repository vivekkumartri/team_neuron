resources:
  apps:
    story_engine:
      name: ${var.app_name}
      description: Story Engine FastAPI and static web application.
      source_code_path: .
      config:
        command:
          - bash
          - -lc
          - PYTHONPATH=src python -m uvicorn story_engine.app:app --host 0.0.0.0 --port 8000
        env:
          - name: ENDPOINT_NAME
            value: ${var.lakebase_endpoint}
          - name: OPENAI_API_KEY
            value_from: openai_api_key
          - name: OPENAI_MODEL
            value: gpt-5.6-sol
          - name: STORY_ENGINE_GENERATION_JOB_ID
            value_from: generation_job
      # Lakebase Autoscaling resource. Databricks creates a scoped App service
      # principal role and injects PG* connection metadata at runtime; neither
      # a database password nor a connection URL belongs in source control.
      resources:
        - name: postgres
          postgres:
            branch: ${var.lakebase_project}
            database: ${var.lakebase_database}
            permission: CAN_CONNECT_AND_CREATE
        - name: openai_api_key
          secret:
            scope: story-engine-openai
            key: openai-api-key
            permission: READ
        - name: generation_job
          job:
            id: ${resources.jobs.generation_job.id}
            permission: CAN_MANAGE_RUN
