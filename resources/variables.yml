variables:
  workspace_host:
    description: Legacy workspace URL variable; DAB authentication hosts must be set per target.
    default: ""
  app_name:
    description: Globally unique lowercase Databricks App name.
    default: story-engine
  catalog_name:
    description: Unity Catalog name for governed Story Engine data.
    default: story_engine
  schema_name:
    description: Unity Catalog schema name for the selected environment.
    default: app
  lakebase_project:
    description: Lakebase project resource ID; supplied per target after provisioning.
    default: ""
  lakebase_database:
    description: Lakebase database resource ID; supplied per target after provisioning.
    default: ""
  lakebase_endpoint:
    description: Lakebase read-write endpoint resource ID used for OAuth credential rotation.
    default: ""
  volume_name:
    description: Unity Catalog Volume name for approved artifacts.
    default: artifacts
